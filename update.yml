name: Update NAR Data
on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch keiba.go.jp
        run: |
          mkdir -p data
          curl -sL -A "Mozilla/5.0" "https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/TodayRaceInfo.json" -o data/today.json || echo '{"tracks":["monbetsu","oi","nagoya","sonoda"]}' > data/today.json
      - name: Commit
        run: |
          git config user.name "nar-bot"
          git config user.email "bot@nar-dashboard.local"
          git add data/today.json
          git commit -m "auto update" || echo "no changes"
          git push
